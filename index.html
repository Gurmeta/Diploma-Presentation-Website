<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8ebf0" />
    <meta
      name="description"
      content="Интерактивна презентация за защита на дипломна работа: автоматизирано създаване на уебсайт чрез Microsoft Azure и Infrastructure as Code (Terraform)."
    />

    <meta property="og:title" content="Автоматизирано създаване на уебсайт чрез Azure и IaC" />
    <meta property="og:description" content="Интерактивна презентация – Георги Стефанов, ВУТП" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1a2b'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash
      (function () {
        try {
          var saved = localStorage.getItem('presentation-theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

  </head>

  </body>
</html>
